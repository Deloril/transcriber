[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default: deselect slow/gpu so the fast suite runs in seconds and is suitable
# for the pre-commit hook. Run them with:
#   pytest -m slow      # real-model tests, no GPU required
#   pytest -m gpu       # tests requiring CUDA
#   pytest -m "slow or gpu"
addopts = -ra -q --strict-markers -m "not slow and not gpu"

markers =
    slow: real-model tests that load whisperx/pyannote/NeMo (minutes to run)
    gpu: requires a CUDA GPU; skipped on CPU-only machines

asyncio_mode = auto

filterwarnings =
    # Quiet the third-party warning noise so a failing test stands out.
    ignore::DeprecationWarning:pyannote.*
    ignore::UserWarning:pyannote.*
    ignore::DeprecationWarning:torchaudio.*
    ignore::UserWarning:torchaudio.*
