<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scribe — Documentation</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  {% include "_themes.html" %}
  <style>
    * { box-sizing: border-box; }
    html, body { background: var(--bg); color: var(--text); margin: 0; min-height: 100%; }
    body {
      font-family: var(--sans);
      background:
        radial-gradient(900px 520px at -8% -10%, var(--wash-1), transparent 65%),
        radial-gradient(720px 480px at 110% 110%, var(--wash-2), transparent 60%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      background-attachment: fixed;
      min-height: 100vh;
    }
    body::before {
      content: ""; position: fixed; inset: 0;
      background-image: var(--grain-svg);
      opacity: var(--grain-opacity); mix-blend-mode: var(--grain-blend);
      pointer-events: none; z-index: 0;
    }
    body > * { position: relative; z-index: 1; }
    .wrap { max-width: 860px; margin: 0 auto; padding: 32px 24px 80px; }
    .topbar {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 24px; color: var(--muted); font-size: 13px;
    }
    .topbar a { color: var(--accent); text-decoration: none; }
    .topbar a:hover { text-decoration: underline; }
    .topbar .spacer { flex: 1; }
  </style>
  {% include "_doc_styles.html" %}
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a href="/">← Back to Scribe</a>
      <span>·</span>
      <span>Documentation</span>
      <span class="spacer"></span>
      {% include "_themes_picker.html" %}
    </div>
    <div class="doc">{{ content | safe }}</div>
  </div>
</body>
</html>
