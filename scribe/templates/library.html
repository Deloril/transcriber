<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scribe — library</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  {% include "_themes.html" %}
  <style>
    * { box-sizing: border-box; }
    html, body { color: var(--text); margin: 0; min-height: 100%; }
    body {
      font-family: var(--sans);
      letter-spacing: .002em;
      background:
        radial-gradient(900px 520px at -8% -10%, var(--wash-1), transparent 65%),
        radial-gradient(720px 480px at 110% 110%, var(--wash-2), transparent 60%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      background-attachment: fixed;
      min-height: 100vh;
    }
    body::before {
      content: "";
      position: fixed; inset: 0;
      background-image: var(--grain-svg);
      opacity: var(--grain-opacity); mix-blend-mode: var(--grain-blend);
      pointer-events: none; z-index: 0;
    }
    body > * { position: relative; z-index: 1; }
    ::selection { background: var(--accent-soft); color: var(--text-strong); }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 36px 24px 96px; }
    header {
      display: flex; align-items: baseline; gap: 12px; margin-bottom: 28px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
      position: relative;
    }
    header::after {
      content: ""; position: absolute; left: 0; bottom: -1px;
      width: 56px; height: 2px; background: var(--accent); border-radius: 2px;
    }
    h1 {
      font-family: var(--serif);
      font-weight: 500;
      font-variation-settings: var(--serif-vary-display);
      font-size: 36px; line-height: 1.05; margin: 0;
      letter-spacing: -.02em; color: var(--text-strong);
      display: inline-flex; align-items: baseline; gap: 10px;
    }
    h1::before { content: "❦"; color: var(--accent); font-size: 22px; }
    header .sub { color: var(--muted); font-size: 13px; letter-spacing: .005em; }
    header .links { margin-left: auto; display: flex; gap: 8px; }
    header a, header button {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 7px 13px;
      font-size: 12.5px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      transition: border-color .15s, color .15s, background .15s;
    }
    header a:hover, header button:hover {
      border-color: var(--accent);
      color: var(--accent-2);
      background: var(--accent-soft);
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .toolbar input[type="search"] {
      flex: 1; min-width: 220px;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 11px;
      font: inherit;
    }
    .toolbar input[type="search"]:focus { outline: 2px solid var(--accent); border-color: transparent; }
    .toolbar .total { color: var(--muted-2); font-size: 12.5px; font-family: var(--mono); letter-spacing: .04em; }
    .toolbar .refresh {
      background: transparent; color: var(--text);
      border: 1px solid var(--border); border-radius: 7px;
      padding: 8px 13px; font-size: 12.5px; cursor: pointer; font-weight: 500;
      font-family: inherit;
      transition: border-color .15s, color .15s, background .15s;
    }
    .toolbar .refresh:hover { border-color: var(--accent); color: var(--accent-2); background: var(--accent-soft); }

    table.lib {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    table.lib thead th {
      text-align: left;
      font-weight: 600;
      font-size: 10.5px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .12em;
      font-family: var(--mono);
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--panel-2);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    table.lib thead th.sorted-asc::after { content: " ▲"; color: var(--accent); }
    table.lib thead th.sorted-desc::after { content: " ▼"; color: var(--accent); }
    table.lib tbody td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    table.lib tbody tr { transition: background .12s; }
    table.lib tbody tr:hover { background: var(--accent-soft); }
    table.lib tbody td.numeric { font-variant-numeric: tabular-nums; white-space: nowrap; }
    table.lib tbody td.filename {
      max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    table.lib tbody td.filename strong {
      color: var(--text-strong); font-weight: 500;
      font-family: var(--serif);
      font-variation-settings: var(--serif-vary-h3);
      font-size: 14.5px;
      letter-spacing: -.005em;
    }
    /* F10.4 — the action cell used to pin `white-space: nowrap` and let
       the buttons (Open, JSON, SRT, Discard media, Delete) overflow the
       1180-px max-width container. On a 14" MacBook the rightmost button
       — Delete — was clipped off the right edge and effectively
       invisible. The inner `.row-actions` flex container wraps cleanly
       so every action stays reachable; the media query at 1100 px
       tightens button padding so buttons usually still fit on one row
       at typical laptop widths. */
    table.lib tbody td.actions {
      /* No nowrap: rely on the inner flex container's wrap behaviour. */
      min-width: 200px;
    }
    table.lib tbody td.actions .row-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    table.lib tbody td.actions a, table.lib tbody td.actions button {
      display: inline-flex;
      align-items: center;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 11.5px;
      font-weight: 500;
      font-family: inherit;
      text-decoration: none;
      cursor: pointer;
      /* margin-right is replaced by the parent flex `gap` so wrapped
         rows don't carry a trailing margin into the next visual line. */
      margin: 0;
      white-space: nowrap;
      transition: border-color .15s, color .15s, background .15s;
    }
    table.lib tbody td.actions a:hover, table.lib tbody td.actions button:hover {
      border-color: var(--accent); color: var(--accent-2); background: var(--accent-soft);
    }
    table.lib tbody td.actions .danger:hover { border-color: var(--err); color: var(--err); background: rgba(217,106,90,.08); }
    table.lib tbody td.actions .disabled {
      opacity: .4; pointer-events: none;
    }
    @media (max-width: 1100px) {
      /* Below ~1100 px the table is tighter, so trim button padding
         and the inter-button gap to keep rows visually compact. The
         flex container will still wrap to a second line if even this
         budget is exceeded — never clip. */
      table.lib tbody td.actions .row-actions { gap: 4px; }
      table.lib tbody td.actions a,
      table.lib tbody td.actions button { padding: 5px 7px; font-size: 11px; }
    }

    .pill {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 999px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-family: var(--mono);
    }
    .pill.status-done { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
    .pill.status-running { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); background: var(--accent-soft); }
    .pill.status-queued { color: var(--muted); }
    .pill.status-error { color: var(--err); border-color: color-mix(in srgb, var(--err) 45%, transparent); }
    .pill.mode { text-transform: lowercase; letter-spacing: .04em; font-weight: 500; font-family: inherit; }

    .speakers { color: var(--muted); }
    .speakers .more { color: var(--accent); }

    /* F10.2 — small icon shown next to the filename when source media
       has been reclaimed via "Discard source media". Hover reveals
       the explainer; the row otherwise behaves identically. */
    .media-flag {
      display: inline-block;
      margin-left: 6px;
      color: var(--warn);
      font-size: 11px;
      cursor: help;
      vertical-align: middle;
    }

    .empty {
      padding: 60px 20px; text-align: center; color: var(--muted);
    }
    .empty a { color: var(--accent); }

    .err-banner {
      background: rgba(255,118,118,.12);
      border: 1px solid rgba(255,118,118,.4);
      color: var(--err);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 14px;
      font-size: 13px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Scribe Library</h1>
      <span class="sub">All persisted transcriptions on this machine</span>
      <span class="links">
        {% include "_themes_picker.html" %}
        <a href="/" title="Back to upload form">← Upload</a>
        <a href="/projects" title="Research projects (academic coding)">Projects →</a>
      </span>
    </header>

    <div class="card">
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search filenames or speakers…" autocomplete="off">
        <button id="refresh" class="refresh" type="button">Refresh</button>
        <span id="total" class="total"></span>
      </div>
    </div>

    <div id="errBanner" class="err-banner hidden"></div>

    <div class="card" style="padding: 0; overflow: hidden;">
      <table class="lib" id="libTable">
        <thead>
          <tr>
            <th data-sort="input_filename">File</th>
            <th data-sort="duration_seconds" class="numeric">Duration</th>
            <th data-sort="mode">Mode</th>
            <th data-sort="speaker_count" class="numeric">Speakers</th>
            <th data-sort="language">Lang</th>
            <th data-sort="created_at" class="numeric sorted-desc">Created</th>
            <th data-sort="status">Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="libBody"></tbody>
      </table>
      <div id="emptyMsg" class="empty hidden">
        No transcriptions yet. <a href="/">Upload a recording →</a>
      </div>
    </div>
  </div>

  <script type="module">
    import {
      fmtDuration, escapeHtml,
      compareLibraryRows, searchLibraryRows, formatLibraryDate,
      formatLibrarySpeakers,
    } from "/static/js/helpers.mjs";

    const $ = (id) => document.getElementById(id);
    const tbody = $("libBody"), emptyMsg = $("emptyMsg"), totalEl = $("total");
    const searchEl = $("search"), refreshBtn = $("refresh");
    const errBanner = $("errBanner");

    let allRows = [];
    let sortKey = "created_at";
    let sortDir = "desc";

    async function loadLibrary() {
      try {
        const r = await fetch("/api/jobs");
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const j = await r.json();
        allRows = Array.isArray(j.jobs) ? j.jobs : [];
        errBanner.classList.add("hidden");
      } catch (e) {
        errBanner.textContent = "Could not load library: " + (e.message || e);
        errBanner.classList.remove("hidden");
        allRows = [];
      }
      render();
    }

    function render() {
      const q = searchEl.value;
      const filtered = searchLibraryRows(allRows, q);
      const sorted = filtered.slice().sort((a, b) =>
        compareLibraryRows(a, b, sortKey, sortDir)
      );
      const showing = sorted.length;
      const total = allRows.length;
      totalEl.textContent =
        showing === total
          ? `${total} ${total === 1 ? "job" : "jobs"}`
          : `${showing} of ${total}`;
      // Update sort-arrow indicators on the headers.
      document.querySelectorAll("table.lib thead th").forEach(th => {
        th.classList.remove("sorted-asc", "sorted-desc");
        if (th.dataset.sort === sortKey) {
          th.classList.add(sortDir === "asc" ? "sorted-asc" : "sorted-desc");
        }
      });
      // Render rows.
      tbody.innerHTML = "";
      if (!sorted.length) {
        emptyMsg.classList.remove("hidden");
        return;
      }
      emptyMsg.classList.add("hidden");
      const frag = document.createDocumentFragment();
      sorted.forEach(row => frag.appendChild(renderRow(row)));
      tbody.appendChild(frag);
    }

    function renderRow(row) {
      const tr = document.createElement("tr");
      tr.dataset.jobId = row.id;

      const filename = escapeHtml(row.input_filename || "(unnamed)");
      const speakers = formatLibrarySpeakers(row.speakers || []);
      const created = formatLibraryDate(row.created_at);
      const duration = fmtDuration(row.duration_seconds || 0);
      const mode = escapeHtml(row.mode || "");
      const lang = escapeHtml((row.language || "—").toUpperCase());
      const status = escapeHtml(row.status || "done");

      const canEdit = row.status === "done";
      const editLink = canEdit
        ? `<a href="/edit/${encodeURIComponent(row.id)}">Open</a>`
        : `<a class="disabled" title="Editor opens once the job finishes">Open</a>`;

      const downloads = (row.has_outputs && canEdit)
        ? `<a href="/api/job/${encodeURIComponent(row.id)}/download/json" title="Download JSON transcript">JSON</a>` +
          `<a href="/api/job/${encodeURIComponent(row.id)}/download/srt" title="Download SRT subtitles">SRT</a>`
        : "";

      // F10.2 — small icon next to the filename when source media has
      // been discarded so the user can see at a glance which rows
      // can no longer play back.
      const mediaFlag = row.media_discarded
        ? `<span class="media-flag" title="Source media discarded — playback is unavailable for this row." aria-label="Source media discarded">📼</span>`
        : "";

      // F10.2 — only offer the discard action while the source still
      // exists. Disabled rows (in-progress / errored) keep their
      // upload directory because the worker may still need it.
      const canDiscard = canEdit && !row.media_discarded;
      const discardBtn = canDiscard
        ? `<button data-action="discard-media" data-id="${escapeHtml(row.id)}" title="Remove the source media file but keep the transcript (reclaim disk space)">Discard media</button>`
        : "";

      tr.innerHTML = `
        <td class="filename" title="${filename}">
          <strong>${filename}</strong>${mediaFlag}
        </td>
        <td class="numeric">${duration}</td>
        <td><span class="pill mode">${mode || "—"}</span></td>
        <td class="numeric speakers">${row.speaker_count} <span class="more">${escapeHtml(speakers)}</span></td>
        <td>${lang}</td>
        <td class="numeric" title="${escapeHtml(row.created_at || "")}">${escapeHtml(created)}</td>
        <td><span class="pill status-${status}">${status}</span></td>
        <td class="actions">
          <div class="row-actions">
            ${editLink}
            ${downloads}
            ${discardBtn}
            <button class="danger" data-action="delete" data-id="${escapeHtml(row.id)}">Delete</button>
          </div>
        </td>
      `;
      return tr;
    }

    tbody.addEventListener("click", async (e) => {
      const delBtn = e.target.closest("button[data-action='delete']");
      const discardBtn = e.target.closest("button[data-action='discard-media']");
      if (delBtn) {
        const jobId = delBtn.dataset.id;
        if (!confirm(`Delete this transcription? This removes the source media and all transcript files. This cannot be undone.`)) return;
        delBtn.disabled = true;
        delBtn.textContent = "Deleting…";
        try {
          const r = await fetch(`/api/job/${encodeURIComponent(jobId)}`, { method: "DELETE" });
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          // Drop the row locally for instant feedback; refresh in the background
          // to confirm the server-side state.
          allRows = allRows.filter(x => x.id !== jobId);
          render();
          loadLibrary();
        } catch (e2) {
          delBtn.disabled = false;
          delBtn.textContent = "Delete";
          errBanner.textContent = "Delete failed: " + (e2.message || e2);
          errBanner.classList.remove("hidden");
        }
        return;
      }
      if (discardBtn) {
        // F10.2 — drop the source recording but keep the transcript.
        const jobId = discardBtn.dataset.id;
        if (!confirm(
          "Discard the source media file?\n\n" +
          "Playback will no longer work for this transcription. " +
          "Your transcript text, edits, search, and exports are kept.\n\n" +
          "This cannot be undone."
        )) return;
        discardBtn.disabled = true;
        discardBtn.textContent = "Discarding…";
        try {
          const r = await fetch(
            `/api/job/${encodeURIComponent(jobId)}/discard-media`,
            { method: "POST" },
          );
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          // Update the local row to reflect discard for instant feedback,
          // then refresh from server to confirm.
          allRows = allRows.map(x =>
            x.id === jobId ? { ...x, media_discarded: true } : x
          );
          render();
          loadLibrary();
        } catch (e2) {
          discardBtn.disabled = false;
          discardBtn.textContent = "Discard media";
          errBanner.textContent = "Discard media failed: " + (e2.message || e2);
          errBanner.classList.remove("hidden");
        }
        return;
      }
    });

    document.querySelectorAll("table.lib thead th[data-sort]").forEach(th => {
      th.addEventListener("click", () => {
        const key = th.dataset.sort;
        if (sortKey === key) {
          sortDir = sortDir === "asc" ? "desc" : "asc";
        } else {
          sortKey = key;
          sortDir = "asc";
          // Numeric and date columns default to descending so the
          // newest/biggest item is at the top.
          if (["duration_seconds", "created_at", "speaker_count"].includes(key)) {
            sortDir = "desc";
          }
        }
        render();
      });
    });

    let searchTimer = null;
    searchEl.addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(render, 60);
    });

    refreshBtn.addEventListener("click", loadLibrary);

    loadLibrary();
  </script>
</body>
</html>
